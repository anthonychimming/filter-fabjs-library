name: Publish library Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Require deliberate validator pin
        env:
          VALIDATOR_REF: ${{ vars.FILTER_FABJS_VALIDATOR_REF }}
        run: |
          [[ "$VALIDATOR_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Set FILTER_FABJS_VALIDATOR_REF to the published Stage 5 validator commit SHA.'; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: library
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: anthonychimming/filter-fabjs
          ref: ${{ vars.FILTER_FABJS_VALIDATOR_REF }}
          path: validator
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned validator dependencies only if locked
        working-directory: validator
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            node --input-type=module -e "import p from './package.json' with {type:'json'}; if(Object.keys(p.dependencies||{}).length || Object.keys(p.devDependencies||{}).length) throw Error('Dependencies require a lockfile');"
          fi
      - name: Validate and build before deployment
        env:
          PUSH_BASE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ "$EVENT_NAME" = push ] && [ -n "$PUSH_BASE" ] && [[ ! "$PUSH_BASE" =~ ^0+$ ]]; then
            args=(--base-ref "$PUSH_BASE")
          elif git -C library rev-parse --verify HEAD^ >/dev/null 2>&1; then
            args=(--base-ref HEAD^)
          fi
          npm --prefix validator run library:build -- --library-root "$GITHUB_WORKSPACE/library" "${args[@]}" --generated-at "$(git -C library show -s --format=%cI HEAD)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: library/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
