name: Validate library
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require deliberate validator pin
        env:
          VALIDATOR_REF: ${{ vars.FILTER_FABJS_VALIDATOR_REF }}
        run: |
          [[ "$VALIDATOR_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Set FILTER_FABJS_VALIDATOR_REF to the published Stage 5 validator commit SHA.'; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: library
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: anthonychimming/filter-fabjs
          ref: ${{ vars.FILTER_FABJS_VALIDATOR_REF }}
          path: validator
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned validator dependencies only if locked
        working-directory: validator
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            node --input-type=module -e "import p from './package.json' with {type:'json'}; if(Object.keys(p.dependencies||{}).length || Object.keys(p.devDependencies||{}).length) throw Error('Dependencies require a lockfile');"
          fi
      - name: Validate and build against publication base
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          test -n "$BASE_REF"
          npm --prefix validator run library:build -- --library-root "$GITHUB_WORKSPACE/library" --base-ref "$BASE_REF" --generated-at "$(git -C library show -s --format=%cI HEAD)"
